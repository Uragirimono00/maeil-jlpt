<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매일 N3 — JLPT N3 일본어 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --g:#58cc02;--g-d:#46a302;--g-l:#d7ffb8;--b:#1cb0f6;--b-d:#1899d6;--r:#ff4b4b;--r-d:#ea2b2b;--r-l:#ffdfe0;
  --y:#ffc800;--o:#ff9600;--p:#ce82ff;
  --bg:#f7f7f7;--card:#fff;--line:#e5e5e5;--ink:#3c3c3c;--mute:#777;--soft:#afafaf;
}
@media (prefers-color-scheme:dark){:root{--bg:#131f24;--card:#1f2c33;--line:#37464f;--ink:#f1f7fb;--mute:#a7b5bd;--soft:#52656d;--g-l:#2b4a12;--r-l:#4a2023}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;font-size:16px}
.jp{font-family:"Noto Sans JP","Noto Sans KR",sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
rt{font-size:.5em;color:var(--mute);font-weight:400}
body.nofuri rt{visibility:hidden}
.hl{color:var(--b);font-weight:700;border-bottom:2px solid var(--b)}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--ink);margin:0 .2em;text-align:center;color:var(--b);font-weight:700}
#app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 64px) 14px calc(env(safe-area-inset-bottom) + 90px)}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--card);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top)}
#top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:6px;height:56px;padding:0 12px}
.logo{font-weight:900;color:var(--g);font-size:20px;margin-right:auto;letter-spacing:-.5px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;padding:6px 8px;border-radius:12px}
.stat:hover{background:var(--bg)}
.stat .n{font-size:15px}
/* bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
#nav button{padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute);border-radius:12px;margin:4px 2px}
#nav button .i{font-size:22px;line-height:1}
#nav button.on{color:var(--b);background:rgba(28,176,246,.12);box-shadow:inset 0 0 0 2px rgba(28,176,246,.5)}
/* common */
h1{font-size:24px;margin:8px 0 14px;font-weight:900}
h2{font-size:19px;margin:22px 0 10px;font-weight:800}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;letter-spacing:.3px;padding:13px 18px;border-radius:14px;background:var(--g);color:#fff;box-shadow:0 4px 0 var(--g-d);transition:transform .05s;text-transform:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g-d)}
.btn.blue{background:var(--b);box-shadow:0 4px 0 var(--b-d)}
.btn.red{background:var(--r);box-shadow:0 4px 0 var(--r-d)}
.btn.ghost{background:var(--card);color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%}
.btn:disabled{background:var(--line);color:var(--soft);box-shadow:0 4px 0 var(--line);cursor:default}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg);border:2px solid var(--line);color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--mute)}
.chips button.on{border-color:var(--b);color:var(--b);background:rgba(28,176,246,.1)}
.spk{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--b);color:#fff;font-size:16px;flex:none;box-shadow:0 3px 0 var(--b-d);vertical-align:middle}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--b-d)}
.spk.sm{width:28px;height:28px;font-size:13px;border-radius:8px}
.spk.f{background:var(--p);box-shadow:0 3px 0 #a568cc}
.mute{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=search],input[type=text]{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:var(--b)}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .4s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.25)}
/* home */
.hero{background:linear-gradient(135deg,var(--g),#2fb80c);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h1{margin:0 0 4px;color:#fff}
.hero .sub{opacity:.92;font-size:14px}
.hero .ring{position:absolute;right:-20px;top:-20px;font-size:110px;opacity:.18}
.goal{display:flex;align-items:center;gap:12px;margin-top:14px}
.goal .bar{flex:1;background:rgba(255,255,255,.35)}
.goal .bar>i{background:var(--y)}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 4px}
.node{width:78px;height:72px;border-radius:50%;font-size:30px;display:flex;align-items:center;justify-content:center;background:var(--g);box-shadow:0 7px 0 var(--g-d);color:#fff;position:relative}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--g-d)}
.node.done{background:var(--y);box-shadow:0 7px 0 #d9a800}
.node.lock{background:var(--line);box-shadow:0 7px 0 var(--soft);color:var(--soft)}
.node.blue{background:var(--b);box-shadow:0 7px 0 var(--b-d)}
.node.purple{background:var(--p);box-shadow:0 7px 0 #a568cc}
.node .lbl{position:absolute;top:100%;margin-top:12px;white-space:nowrap;font-size:13px;font-weight:800;color:var(--ink)}
.pathrow{display:flex;flex-direction:column;align-items:center;margin-bottom:34px}
.bounce{animation:bounce 1.4s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tip{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800;color:var(--g);font-size:13px;margin-bottom:8px;position:relative}
.tip:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line);border-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.mini .big{font-size:22px;font-weight:900}
.mini .t{font-size:12px;color:var(--mute);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:12px;font-weight:700}
.badge .e{font-size:32px;display:block;margin-bottom:4px}
.badge.off{opacity:.4;filter:grayscale(1)}
/* lists */
.vitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:2px solid var(--line)}
.vitem:last-child{border-bottom:0}
.vitem .w{font-size:21px;font-weight:600;line-height:1.9}
.vitem .k{font-size:14px;color:var(--mute)}
.list{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.star{font-size:20px;color:var(--soft)}
.star.on{color:var(--y)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.kcell{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;box-shadow:0 3px 0 var(--line)}
.kcell .c{font-size:30px;line-height:1.2}
.kcell .h{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcell.known{border-color:var(--g);box-shadow:0 3px 0 var(--g)}
.gitem{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:2px solid var(--line);width:100%;text-align:left}
.gitem:last-child{border-bottom:0}
.gnum{width:34px;height:34px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--mute);flex:none}
.gnum.done{background:var(--g);color:#fff}
.gt{font-weight:700;font-size:16px}
.gm{font-size:13px;color:var(--mute)}
.sec{font-size:12px;font-weight:800;color:var(--b);letter-spacing:.5px;margin:16px 0 6px}
.ex{padding:12px 0;border-top:2px dashed var(--line)}
.ex:first-of-type{border-top:0}
.ex .j{font-size:19px;line-height:2.1}
.ex .k{color:var(--mute);font-size:14px}
/* modal / overlay */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 24px)}
.ov .in{max-width:720px;margin:0 auto}
.x{font-size:26px;color:var(--soft);padding:4px 8px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.qhead .bar{flex:1}
.hearts{font-weight:800;color:var(--r);white-space:nowrap}
.combo{font-weight:900;color:var(--o);font-size:13px;text-align:center;height:18px;margin-bottom:6px}
.qtype{font-weight:800;font-size:20px;margin-bottom:14px}
.qprompt{font-size:30px;line-height:2;text-align:center;padding:18px 8px;background:var(--card);border:2px solid var(--line);border-radius:18px;margin-bottom:16px;position:relative}
.qprompt.sent{font-size:20px;text-align:left;line-height:2.2}
.qprompt .spk{position:absolute;right:10px;top:10px}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-size:17px;text-align:left;display:flex;align-items:center;gap:12px;line-height:1.8}
.opt .n{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mute);flex:none;font-weight:800}
.opt.sel{border-color:var(--b);background:rgba(28,176,246,.1);box-shadow:0 4px 0 var(--b)}
.opt.ok{border-color:var(--g);background:var(--g-l);box-shadow:0 4px 0 var(--g)}
.opt.ng{border-color:var(--r);background:var(--r-l);box-shadow:0 4px 0 var(--r)}
.opt:disabled{cursor:default}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);border-top:2px solid var(--line);background:var(--card)}
.fb .in{max-width:720px;margin:0 auto}
.fb.ok{background:var(--g-l);border-color:transparent}
.fb.ng{background:var(--r-l);border-color:transparent}
.fb .t{font-weight:900;font-size:20px;margin-bottom:6px}
.fb.ok .t{color:var(--g-d)}
.fb.ng .t{color:var(--r-d)}
.fb .d{font-size:15px;margin-bottom:12px;line-height:1.9}
.intro{text-align:center;padding:20px 0}
.intro .w{font-size:52px;line-height:2;font-weight:600}
.intro .k{font-size:22px;font-weight:700;margin:6px 0}
.result{text-align:center;padding:30px 0}
.result .e{font-size:84px}
.result .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.result .stats div{border:2px solid var(--y);border-radius:14px;padding:10px 4px;font-weight:900}
.result .stats div:nth-child(2){border-color:var(--g)}
.result .stats div:nth-child(3){border-color:var(--b)}
.result .stats small{display:block;font-size:11px;color:var(--mute);font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:pop .3s}
/* kana */
.kana-t{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kana-t.y{grid-template-columns:repeat(3,1fr)}
.kc{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 0;text-align:center;box-shadow:0 3px 0 var(--line)}
.kc .c{font-size:28px;line-height:1.2}
.kc .r{font-size:11px;color:var(--mute);font-weight:700}
.kc.e{visibility:hidden}
.kc .m{height:4px;margin:4px 10px 0;border-radius:4px;background:var(--line)}
.kc .m i{display:block;height:100%;border-radius:4px;background:var(--g)}
.set label{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:2px solid var(--line);gap:10px}
.set label:last-child{border-bottom:0}
.set select,.set input[type=range]{font-family:inherit;font-size:14px}
select{padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.tog{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none}
.tog:checked{background:var(--g)}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tog:checked:after{left:21px}
.timer{font-weight:800;color:var(--mute);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mute);padding:30px}
/* account */
.acc input{margin-bottom:10px}
input[type=password]{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-family:inherit;outline:none}
.acmsg{min-height:20px;font-size:13px;font-weight:700;margin:2px 0 10px}
.acmsg.err{color:var(--r)}
.acmsg.ok{color:var(--g-d)}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--soft);margin-right:6px;vertical-align:middle}
.syncdot.ok{background:var(--g)}.syncdot.syncing{background:var(--b)}.syncdot.error,.syncdot.offline{background:var(--r)}
.linkbtn{color:var(--b);font-weight:800;text-decoration:underline}
/* 키보드 힌트: 마우스 쓰는 기기에서만 보인다 */
.kh{display:none}
@media (hover:hover) and (pointer:fine){span.kh{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:800;background:rgba(255,255,255,.22);opacity:.9}p.kh{display:block}}

/* ---------------- animation ----------------
   body.anim 일 때만 켜진다 (설정 > 애니메이션, OS의 '동작 줄이기'를 켜면 기본 꺼짐) */
body:not(.anim) *,body:not(.anim) *:before,body:not(.anim) *:after{animation:none!important;transition:none!important}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideUp{from{transform:translateY(100%)}}
@keyframes ovIn{from{opacity:0;transform:translateY(24px) scale(.98)}}
@keyframes nodeIn{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes okPop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(88,204,2,.55),0 4px 0 var(--g)}100%{box-shadow:0 0 0 14px rgba(88,204,2,0),0 4px 0 var(--g)}}
@keyframes xpUp{0%{opacity:0;transform:translateY(6px) scale(.7)}25%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(3deg)}}
@keyframes hbreak{0%{transform:scale(1)}30%{transform:scale(1.6)}100%{transform:scale(1);filter:grayscale(1);opacity:.5}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes wiggle{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.2) rotate(8deg)}80%{transform:rotate(-4deg)}100%{transform:scale(1) rotate(0)}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes flipIn{from{transform:perspective(900px) rotateY(-90deg)}to{transform:perspective(900px) rotateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateX(40px) rotate(3deg)}}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-14px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(6deg)}}
.anim #app.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.anim #app.enter .node{animation:nodeIn .5s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:calc(120ms + var(--n,0)*90ms)}
.anim #app.enter .node.bounce{animation:nodeIn .5s cubic-bezier(.3,1.4,.5,1) backwards,bounce 1.4s .9s infinite}
.anim .bar>i{animation:fillw .9s cubic-bezier(.2,.8,.2,1)}
@keyframes fillw{from{width:0}}
.anim .qhead .bar>i{animation:none;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.anim .bar>i:after{content:"";display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:200% 100%;animation:shine 2.6s linear infinite}
.anim .hero .ring{animation:float 4s ease-in-out infinite}
.anim .node.bounce:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--g);animation:ring 1.6s ease-out infinite}
.anim .ov{animation:ovIn .3s cubic-bezier(.2,.8,.2,1)}
.anim .sheet{animation:fadeIn .2s}
.anim .sheet>div{animation:slideUp .32s cubic-bezier(.2,.9,.3,1)}
.anim .qanim .qtype,.anim .qanim .qprompt{animation:rise .35s cubic-bezier(.2,.8,.2,1) backwards}
.anim .qanim .qprompt{animation-delay:.05s}
.anim .qanim .opt{animation:rise .35s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.1s + var(--i,0)*55ms)}
.anim .opt{transition:transform .08s,border-color .15s,background .15s}
.anim .opt:active{transform:translateY(2px)}
.anim .opt.sel{transform:scale(1.015)}
.anim .opt.ok{animation:okPop .4s,glow .7s ease-out}
.anim .opt.ng{animation:shake .35s}
.anim .fb.ok,.anim .fb.ng{animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
.anim .fb .t{animation:pop .35s}
.xpf{position:fixed;z-index:90;pointer-events:none;font-weight:900;font-size:22px;color:var(--y);text-shadow:0 2px 0 #d9a800,0 0 12px rgba(255,200,0,.5);animation:xpUp 1.1s ease-out forwards}
.anim .combo.hot{animation:flame .5s ease-in-out infinite;display:block}
.hearts .h{display:inline-block}
.anim .hearts .h.lost{animation:hbreak .7s ease-out forwards}
.anim .stat.bump .n,.anim .stat.bump>span:first-child{display:inline-block;animation:bump .45s}
.anim .result .e{animation:wiggle .7s cubic-bezier(.3,1.4,.5,1) backwards}
.anim .result h1{animation:rise .4s .15s backwards}
.anim .result .stats div{animation:nodeIn .5s cubic-bezier(.3,1.4,.5,1) backwards}

<body>
<div id="top"><div class="in">
  <div class="logo">매일 N3</div>
  <button class="stat" id="sStreak" title="연속 학습일"><span>🔥</span><span class="n" id="nStreak">0</span></button>
  <button class="stat" id="sGem" title="총 XP"><span>⚡</span><span class="n" id="nXP">0</span></button>
  <button class="stat" id="sLv" title="레벨"><span>🏅</span><span class="n" id="nLv">1</span></button>
  <button class="stat" id="sAcc" title="계정 · 동기화"><span id="iAcc">👤</span></button>
  <button class="stat" id="sSet" title="설정"><span>⚙️</span></button>
</div></div>
<div id="app"></div>
<div id="nav"><div class="in">
  <button data-v="home" class="on"><span class="i">🏠</span>오늘</button>
  <button data-v="grammar"><span class="i">📘</span>문법</button>
  <button data-v="vocab"><span class="i">📝</span>어휘</button>
  <button data-v="kanji"><span class="i">漢</span>한자</button>
  <button data-v="exam"><span class="i">🎯</span>모의고사</button>
  <button data-v="kana"><span class="i">あ</span>가나</button>
</div></div>
<script>
const DATA = /*DATA*/;
const V = DATA.vocab, KJ = DATA.kanji, G = DATA.grammar;
const VORD = [...V].sort((a,b)=>a.o-b.o);
const byW = {}; V.forEach(v=>{(byW[v.r]=byW[v.r]||[]).push(v)});

/* ---------------- storage ---------------- */
const KEY='maeil-n3-v1';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const addDays=(s,n)=>{const d=new Date(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DEF={xp:0,streak:0,best:0,last:null,days:{},goal:50,perDay:5,srs:{},gdone:{},kana:{},kknown:{},star:{},furi:true,rate:.9,voice:'auto',sfx:true,vol:.7,anim:!matchMedia('(prefers-reduced-motion: reduce)').matches,exams:[],badges:{},lessons:0,perfect:0,freezes:0};
// _ut: 마지막 수정 시각(ms) · _ep: 초기화 횟수(초기화가 다른 기기에도 퍼지게) · _uid: 이 기록이 연결된 계정
let S; try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S={...DEF}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S._ut=Date.now();saveLocal();if(typeof queuePush==='function')queuePush()}
function dayXP(){return (S.days[today()]||0)}
function addXP(n){S.xp+=n;S.days[today()]=(S.days[today()]||0)+n;touchStreak();save();hdr()}
function touchStreak(){const t=today();if(S.last===t)return;
  if(S.last&&dayDiff(S.last,t)===1)S.streak++;
  else if(S.last&&dayDiff(S.last,t)===2&&S.freezes>0){S.freezes--;S.streak++;toast('🧊 스트릭 보호권을 사용했어요!')}
  else S.streak=1;
  S.last=t;S.best=Math.max(S.best,S.streak);
  if(S.streak%7===0){S.freezes=Math.min(3,S.freezes+1);setTimeout(()=>toast('🧊 7일 연속! 스트릭 보호권 +1'),800)}
}
function liveStreak(){if(!S.last)return 0;const d=dayDiff(S.last,today());if(d<=1)return S.streak;if(d===2&&S.freezes>0)return S.streak;return 0}
const level=xp=>Math.floor(Math.sqrt(xp/40))+1;
const lvXP=l=>40*(l-1)*(l-1);

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ruby(s,{blank=false,hide=null}={}){
  let h=esc(s).replace(/([^\s{}\[\]、。，！？「」（）・ー぀-ゟ゠-ヿ\w]+?)\{([^}]+)\}/g,(m,a,b)=>{
    return `<ruby>${a}<rt>${b}</rt></ruby>`});
  h=h.replace(/\[\[(.*?)\]\]/g,(m,a)=>blank?'<span class="blank">　？　</span>':`<span class="hl">${a}</span>`);
  return h;
}
const plain=s=>String(s).replace(/\{[^}]*\}/g,'').replace(/\[\[|\]\]/g,'');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const sample=(a,n)=>shuffle(a).slice(0,n);
const hasK=s=>/[一-鿿々]/.test(s);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'];for(let i=0;i<70;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=pick(cols);e.style.animationDuration=(1.6+Math.random()*1.6)+'s';e.style.animationDelay=Math.random()*.4+'s';c.appendChild(e)}document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}

/* ---------------- TTS ----------------
   화면의 후리가나대로 읽히도록, 후리가나가 달린 한자는 읽기(가나)로 바꿔서 음성 엔진에 넘긴다.
   (예: 日{にち} → にち. 한자만 넘기면 엔진이 문맥 없이 ひ 처럼 제멋대로 읽는다) */
const yomi=s=>String(s).replace(/([^\s{}\[\]、。，！？「」（）・ー぀-ゟ゠-ヿ\w]+?)\{([^}]+)\}/g,'$2').replace(/\[\[|\]\]/g,'');
const kyomi=r=>String(r).replace(/[-()（）.]/g,'');  // 한자 음훈 표기(あ(がる), -さ)를 소리 낼 수 있게
let VOICES=[];
// 음질 좋은 음성을 앞으로: Natural/Online(Edge) > Google > Apple 음성 > 구형 음성(Haruka 등)
function vscore(v){const n=v.name;let s=0;if(/natural|neural|online|premium|enhanced/i.test(n))s+=50;if(/google/i.test(n))s+=30;if(/nanami|keita|kyoko|otoya|o-ren|hattori/i.test(n))s+=10;if(/haruka|ayumi|ichiro|sayaka/i.test(n))s-=5;return s}
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/ja/i.test(v.lang)).sort((a,b)=>vscore(b)-vscore(a))}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
const FEM=/(nanami|kyoko|o-ren|haruka|ayumi|mizuki|sayaka|aoi|mayu|shiori|female|女性|google 日本語)/i, MAL=/(keita|otoya|ichiro|hattori|daichi|naoki|\bmale|男性)/i;
function voiceFor(g){if(!VOICES.length)loadVoices();if(!VOICES.length)return null;
  if(S.voice!=='auto'&&!g){const v=VOICES.find(v=>v.name===S.voice);if(v)return v}
  const best=VOICES[0],ok=v=>vscore(v)>=vscore(best)-20;
  if(g==='m')return VOICES.find(v=>MAL.test(v.name)&&ok(v))||best;
  return VOICES.find(v=>FEM.test(v.name)&&!MAL.test(v.name)&&ok(v))||best}
let spT;
function speak(text,g,delay=0){try{const t=yomi(text).trim();if(!t)return;const ss=speechSynthesis;
  const busy=ss.speaking||ss.pending;ss.cancel();clearTimeout(spT);
  const go=()=>{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=S.rate;u.volume=1;const v=voiceFor(g);if(v)u.voice=v;
    if(g==='m'&&(!v||!MAL.test(v.name)))u.pitch=.8;ss.speak(u)};
  // 크롬은 cancel 직후 바로 speak 하면 앞부분이 잘리거나 뭉개질 때가 있어 잠깐 쉬었다 읽는다
  if(busy||delay)spT=setTimeout(go,Math.max(delay,busy?90:0));else go()}catch(e){toast('이 브라우저는 음성 재생을 지원하지 않아요')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();speak(b.dataset.say,b.dataset.g)}},true);
const spk=(t,cls='',g='')=>`<button class="spk ${cls}" data-say="${esc(t)}" ${g?`data-g="${g}"`:''} aria-label="듣기">🔊</button>`;

/* ---------------- sound fx ----------------
   효과음은 전부 Web Audio로 합성한다(음원 파일 없음). sfx('ok') 처럼 부른다 */
let AC,MG,acIdle;
function audio(){if(AC)return AC;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();MG=AC.createGain();MG.gain.value=S.vol;MG.connect(AC.destination);return AC}
function tone(t,f,d,{to,type='triangle',v=.2,at=.008}={}){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(MG);o.start(t);o.stop(t+d+.05)}
function hiss(t,d,{f=1500,to,q=1.2,v=.12}={}){const b=AC.createBuffer(1,Math.ceil(AC.sampleRate*d),AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;const bf=AC.createBiquadFilter();bf.type='bandpass';bf.Q.value=q;bf.frequency.setValueAtTime(f,t);if(to)bf.frequency.exponentialRampToValueAtTime(to,t+d);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.3);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(bf).connect(g).connect(MG);s.start(t);s.stop(t+d+.02)}
const arp=(t,fs,step,d,o={})=>fs.forEach((f,i)=>tone(t+i*step,f,d,o));
const SFX={
  tap:t=>tone(t,1100,.05,{to:700,v:.07}),
  ok:t=>{tone(t,784,.14,{v:.2});tone(t+.08,1175,.32,{v:.22});tone(t+.08,2350,.26,{type:'sine',v:.04})},
  ng:t=>{tone(t,220,.16,{to:180,type:'square',v:.06});tone(t+.14,165,.3,{to:130,type:'square',v:.06})},
  combo:(t,n)=>{const b=523*Math.pow(2,Math.min(12,n-3)/12);arp(t,[b,b*1.26,b*1.5,b*2],.055,.16,{v:.12})},
  start:t=>{tone(t,392,.22,{to:784,type:'sine',v:.14});hiss(t,.22,{f:800,to:3000,v:.05})},
  flip:t=>hiss(t,.16,{f:700,to:2600,v:.1}),
  sheet:t=>hiss(t,.14,{f:500,to:1500,v:.05}),
  know:t=>tone(t,660,.1,{to:990,type:'sine',v:.14}),
  dunno:t=>tone(t,440,.14,{to:330,type:'sine',v:.12}),
  win:t=>{arp(t,[523,659,784],.09,.2,{v:.16});tone(t+.27,1047,.6,{v:.18});tone(t+.27,1319,.6,{type:'sine',v:.07});tone(t+.27,784,.6,{type:'sine',v:.07})},
  fail:t=>arp(t,[392,330,262],.18,.32,{v:.13}),
  level:t=>{arp(t,[392,523,659,784],.08,.18,{v:.14});[1047,1319,1568].forEach(f=>tone(t+.34,f,.8,{v:.09}));arp(t+.4,[2093,2637,3136,2637,3136],.06,.12,{type:'sine',v:.03})},
  goal:t=>{arp(t,[659,784,988],.08,.18,{v:.14});tone(t+.24,1319,.5,{v:.16})},
  badge:t=>arp(t,[1568,2093,2637,3136,4186],.05,.22,{type:'sine',v:.06}),
  coin:t=>{tone(t,988,.07,{type:'square',v:.045});tone(t+.07,1319,.25,{type:'square',v:.045})},
};
function sfx(name,arg){if(!S.sfx||!SFX[name])return;const a=audio();if(!a)return;
  const go=()=>{try{MG.gain.value=S.vol;SFX[name](a.currentTime+.01,arg)}catch(e){}
    // 한동안 안 쓰면 오디오를 쉬게 해서 TTS 음성과 부딪히지 않게 한다(특히 iOS)
    clearTimeout(acIdle);acIdle=setTimeout(()=>{try{a.suspend()}catch(e){}},3000)};
  if(a.state!=='running')a.resume().then(go,()=>{});else go()}
// 버튼 탭 소리 (자기 소리가 따로 있는 버튼은 뺀다)
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b&&!b.disabled&&!b.closest('[data-say],#chk,#flc,#fly,#fln'))sfx('tap')},true);

/* ---------------- SRS ---------------- */
const IV=[0,1,2,4,7,15,30,60];
function srsGet(id){return S.srs[id]}
function srsGrade(id,ok){const s=S.srs[id]||{b:0,d:today()};if(ok){s.b=Math.min(IV.length-1,s.b+1)}else{s.b=Math.max(1,s.b-2)}s.d=addDays(today(),IV[s.b]);s.n=(s.n||0)+1;S.srs[id]=s}
function dueIds(){const t=today();return Object.entries(S.srs).filter(([k,s])=>s.d<=t).map(([k])=>k)}
function learnedCount(){return Object.keys(S.srs).filter(k=>k.startsWith('v')).length}
function newWords(n){const out=[];for(const v of VORD){if(!S.srs['v'+v.i]){out.push(v);if(out.length>=n)break}}return out}
function nextGrammar(){return G.find(g=>!S.gdone[g.id])}

/* ---------------- question generators ---------------- */
const KTOG={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
Object.entries({...KTOG}).forEach(([a,b])=>KTOG[b]=a);
function mutate(r){const ops=[
  s=>{const idx=[...s].map((c,i)=>KTOG[c]?i:-1).filter(i=>i>=0);if(!idx.length)return null;const i=pick(idx);return s.slice(0,i)+KTOG[s[i]]+s.slice(i+1)},
  s=>/う/.test(s.slice(1))?s.replace(/(.)う/,'$1'):s.replace(/([こそとのほもよろごぞどぼょ])(?!う)/,'$1う'),
  s=>/っ/.test(s)?s.replace('っ',pick(['つ',''])):(s.length>2?s.slice(0,1)+'っ'+s.slice(1):null),
  s=>/[ゃゅょ]/.test(s)?s.replace(/[ゃゅょ]/,c=>({'ゃ':'や','ゅ':'ゆ','ょ':'よ'}[c])):s.replace(/([きしちにひみりぎじびぴ])([やゆよ])/,(m,a,b)=>a+({'や':'ゃ','ゆ':'ゅ','よ':'ょ'}[b])),
  s=>/い$/.test(s)&&s.length>2?s.replace(/い(?=[^い]*$)/,'え'):s.replace(/ん/,''),
  s=>s.length>2?s.replace(/^(.)(.)/,(m,a,b)=>a+(KTOG[b]||b)):null];
  const out=new Set();let guard=0;
  while(out.size<3&&guard++<80){let s=r;const k=1+(Math.random()<.35);for(let i=0;i<k;i++){const t=pick(ops)(s);if(t)s=t}
    if(s&&s!==r&&!out.has(s)&&!(byW[s]&&byW[s].some(v=>v.w===byW[r]?.[0]?.w)))out.add(s)}
  // fallback: other words' readings of similar length
  while(out.size<3){const v=pick(V);if(v.r!==r&&Math.abs(v.r.length-r.length)<=1)out.add(v.r)}
  return [...out];
}
function distract(v,n,key,filt=()=>true){const pool=V.filter(x=>x.w!==v.w&&x.k!==v.k&&x[key]!==v[key]&&filt(x));
  const same=pool.filter(x=>x.p===v.p);const out=[];for(const x of [...shuffle(same.length>=n*3?same:pool),...shuffle(pool)]){if(!out.some(o=>o[key]===x[key]||o.k===x.k))out.push(x);if(out.length>=n)break}return out}
const POSNM={'동사':'동사','명사':'명사'};
function qMeaning(v){const ds=distract(v,3,'k');return {id:'v'+v.i,type:'뜻을 고르세요',prompt:ruby(v.f),say:v.f,cls:'',opts:shuffle([{h:esc(v.k),ok:1},...ds.map(d=>({h:esc(d.k)}))]),ans:`${ruby(v.f)} — ${esc(v.k)}`}}
function qReverse(v){const ds=distract(v,3,'w');return {id:'v'+v.i,type:'알맞은 일본어를 고르세요',prompt:`<span style="font-size:24px;font-weight:800">${esc(v.k)}</span>`,opts:shuffle([{h:`<span class="jp">${ruby(v.f)}</span>`,ok:1,say:v.f},...ds.map(d=>({h:`<span class="jp">${ruby(d.f)}</span>`,say:d.f}))]),ans:`${ruby(v.f)} — ${esc(v.k)}`,sayAfter:v.f}}
function qReading(v){if(!hasK(v.w))return qMeaning(v);const ds=mutate(v.r);return {id:'v'+v.i,type:'漢字読み — 읽는 법을 고르세요',prompt:`<span class="jp">${esc(v.w)}</span>`,nofuri:1,opts:shuffle([{h:`<span class="jp">${v.r}</span>`,ok:1},...ds.map(d=>({h:`<span class="jp">${d}</span>`}))]),ans:`${ruby(v.f)} — ${esc(v.k)}`,sayAfter:v.f}}
function qWriting(v){if(!hasK(v.w))return qReverse(v);
  let ds=(byW[v.r]||[]).filter(x=>x.w!==v.w&&hasK(x.w)).map(x=>x.w);
  const ks=[...v.w].filter(c=>hasK(c));
  if(ds.length<3){const pool=V.filter(x=>x.w!==v.w&&hasK(x.w)&&x.w.length===v.w.length&&[...x.w].some(c=>ks.includes(c))).map(x=>x.w);ds=[...new Set([...ds,...shuffle(pool)])]}
  if(ds.length<3){
    // swap one kanji with a similar-looking/random N3 kanji
    while(ds.length<3){const c=pick(ks);const s=v.w.replace(c,pick(KJ).c);if(s!==v.w&&!ds.includes(s))ds.push(s)}}
  ds=ds.slice(0,3);
  return {id:'v'+v.i,type:'表記 — 알맞은 한자를 고르세요',prompt:`<span class="jp">${v.r}</span>`,say:v.r,opts:shuffle([{h:`<span class="jp">${esc(v.w)}</span>`,ok:1},...ds.map(d=>({h:`<span class="jp">${esc(d)}</span>`}))]),ans:`${ruby(v.f)} — ${esc(v.k)}`,sayAfter:v.f}}
function qListen(v){const ds=distract(v,3,'k');return {id:'v'+v.i,type:'듣고 뜻을 고르세요',listen:v.f,prompt:`<button class="btn blue" data-say="${esc(v.f)}" style="font-size:22px;padding:18px 28px">🔊 다시 듣기</button>`,opts:shuffle([{h:esc(v.k),ok:1},...ds.map(d=>({h:esc(d.k)}))]),ans:`${ruby(v.f)} — ${esc(v.k)}`}}
const GMARK=G.flatMap(g=>g.s.map(s=>{const m=s.j.match(/\[\[(.*?)\]\]/g);return m&&m.length===1?{g:g.id,f:m[0].slice(2,-2)}:null}).filter(Boolean)).filter(x=>plain(x.f).length<=9);
function qGrammar(g,si){const cand=g.s.map((s,i)=>[s,i]).filter(([s])=>/\[\[/.test(s.j)&&(s.j.match(/\[\[/g)||[]).length===1);
  if(!cand.length)return null;const [s]=si!=null&&cand[si]?cand[si]:pick(cand);const ans=s.j.match(/\[\[(.*?)\]\]/)[1];
  const tail=plain(ans).slice(-1);let pool=GMARK.filter(x=>x.g!==g.id&&plain(x.f)!==plain(ans));
  const near=pool.filter(x=>plain(x.f).slice(-1)===tail);
  const ds=[];for(const x of [...shuffle(near),...shuffle(pool)]){if(!ds.some(d=>plain(d)===plain(x.f)))ds.push(x.f);if(ds.length>=3)break}
  return {id:'g'+g.id,type:'文法 — （　）에 들어갈 말을 고르세요',prompt:`<span class="jp">${ruby(s.j,{blank:true})}</span>`,cls:'sent',opts:shuffle([{h:`<span class="jp">${ruby(ans)}</span>`,ok:1},...ds.map(d=>({h:`<span class="jp">${ruby(d)}</span>`}))]),ans:`<span class="jp">${ruby(s.j)}</span><br><span class="mute">${esc(s.k)}</span><br><b>${esc(g.t)}</b> : ${esc(g.m)}`,sayAfter:s.j}}
function qKanji(k){const ds=sample(KJ.filter(x=>x.c!==k.c),3);return {id:'k'+k.c,type:'한자의 훈음을 고르세요',prompt:`<span class="jp" style="font-size:56px">${k.c}</span>`,opts:shuffle([{h:esc(k.h),ok:1},...ds.map(d=>({h:esc(d.h)}))]),ans:`${k.c} — ${esc(k.h)} <span class="mute">(${k.on.join('・')||'-'} / ${k.kun.join('・')||'-'})</span>`,sayAfter:kyomi(k.on[0]||k.kun[0]||'')}}
const VGEN=[qMeaning,qReverse,qReading,qWriting,qListen];
function qForId(id){if(id[0]==='v'){const v=V[+id.slice(1)];return pick(VGEN)(v)}if(id[0]==='g'){return qGrammar(G[+id.slice(1)])}if(id[0]==='k'){return qKanji(KJ.find(k=>k.c===id.slice(1)))}}

/* ---------------- quiz runner ---------------- */
let Q=null;
function runQuiz({title,items,intro=[],hearts=3,timed=0,onDone,mode='lesson',grammarIntro=null}){
  Q={title,items:[...items],queue:[...items],intro:[...intro],grammarIntro,hearts,maxH:hearts,done:0,total:items.length,correct:0,wrong:0,combo:0,maxCombo:0,xp:0,start:Date.now(),timed,onDone,mode,log:[],retry:new Set()};
  const ov=document.createElement('div');ov.className='ov';ov.id='quiz';document.body.appendChild(ov);document.body.style.overflow='hidden';
  if(timed){Q.timer=setInterval(()=>{const left=Math.max(0,timed-Math.floor((Date.now()-Q.start)/1000));const el=$('#qtimer');if(el)el.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(Q.timer);finishQuiz(true)}},500)}
  Q.pct=0;sfx('start');
  if(grammarIntro)showGrammarIntro();else if(Q.intro.length)showIntro(0);else nextQ();
}
function heartsH(lost=-1){return Array.from({length:Q.maxH},(_,i)=>`<span class="h ${i===lost?'lost':''}">${i<Q.hearts||i===lost?'❤️':'🤍'}</span>`).join('')}
function setBar(){const p=Math.round(Q.done/Q.total*100);Q.pct=p;const b=$('.qhead .bar>i');if(b)b.style.width=p+'%'}
// 정답 위로 "+12 XP" 가 떠오르는 효과
function xpFloat(txt,el){if(!S.anim||!el)return;const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='xpf';d.textContent=txt;d.style.left=(r.right-110)+'px';d.style.top=(r.top-6)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1150)}
// 숫자가 0부터 올라가는 효과
function countUp(el,to,suf=''){if(!el)return;if(!S.anim||!to){el.firstChild.textContent=to+suf;return}const t0=performance.now(),D=900;
  const f=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);el.firstChild.textContent=Math.round(to*e)+suf;if(k<1)requestAnimationFrame(f)};el.firstChild.textContent='0'+suf;setTimeout(()=>requestAnimationFrame(f),250)}
function closeQuiz(){NEEDR=false;if(Q&&Q.timer)clearInterval(Q.timer);const o=$('#quiz');if(o)o.remove();$('.fb')?.remove();document.body.style.overflow='';Q=null;try{speechSynthesis.cancel()}catch(e){}render()}
function qTop(){const pct=Q.pct||0;
  return `<div class="qhead"><button class="x" onclick="confirmQuit()">✕</button><div class="bar"><i style="width:${pct}%"></i></div>${Q.timed?`<span class="timer" id="qtimer"></span>`:`<span class="hearts">${heartsH()}</span>`}</div>`}
function confirmQuit(){sheet(`<h2 style="margin-top:0">정말 그만둘까요?</h2><p class="mute">지금 나가면 이번 레슨 진행 상황이 사라져요.</p><div class="row"><button class="btn ghost grow" onclick="closeSheet()">계속하기</button><button class="btn red grow" onclick="closeSheet();closeQuiz()">그만두기</button></div>`)}
function showGrammarIntro(){const g=Q.grammarIntro;Q.st='intro';$('#quiz').innerHTML=`<div class="in">${qTop()}<div class="chip">오늘의 문법</div>${grammarBody(g)}<div style="height:90px"></div></div>
  <div class="fb"><div class="in"><button class="btn wide" onclick="Q.grammarIntro=null;Q.intro.length?showIntro(0):nextQ()">이해했어요! 문제 풀기 →<span class="kh">Space</span></button></div></div>`}
function showIntro(i){const v=Q.intro[i];if(!v){nextQ();return}Q.st='intro';
  const ks=[...v.w].map(c=>KJ.find(k=>k.c===c)).filter(Boolean);
  $('#quiz').innerHTML=`<div class="in">${qTop()}<div class="chip">새 단어 ${i+1} / ${Q.intro.length}</div>
  <div class="intro pop"><div class="w jp">${ruby(v.f)}</div><div class="row" style="justify-content:center;margin-bottom:8px">${spk(v.f)}${spk(v.f,'f','m')}</div>
  <div class="k">${esc(v.k)}</div><span class="chip">${v.p}</span>
  ${ks.length?`<div class="card" style="margin-top:18px;text-align:left">${ks.map(k=>`<div class="row" style="margin:4px 0"><span class="jp" style="font-size:28px">${k.c}</span><span class="grow"><b>${esc(k.h)}</b><br><span class="mute jp" style="font-size:13px">音 ${k.on.join('・')||'-'}　訓 ${k.kun.join('・')||'-'}</span></span></div>`).join('')}</div>`:''}
  </div><div style="height:90px"></div></div>
  <div class="fb"><div class="in"><button class="btn wide" onclick="showIntro(${i+1})">${i+1<Q.intro.length?'다음 단어 →':'문제 풀기 →'}<span class="kh">Space</span></button></div></div>`;
  setTimeout(()=>speak(v.f),250)}
function nextQ(){$('.fb')?.remove();if(!Q)return;if(!Q.queue.length||(!Q.timed&&Q.hearts<=0)){finishQuiz();return}
  Q.st='q';const id=Q.queue.shift();Q.cur=typeof id==='string'?qForId(id):id;if(!Q.cur){Q.done++;nextQ();return}const q=Q.cur;
  const furiOff=q.nofuri;
  $('#quiz').innerHTML=`<div class="in qanim">${qTop()}<div class="combo ${Q.combo>=3?'hot':''}">${Q.combo>=3?`🔥 ${Q.combo} 콤보!`:''}</div>
  <div class="qtype">${q.type}</div>
  <div class="qprompt ${q.cls||''} ${furiOff?'nf':''}">${q.prompt}${q.say?spk(q.say,'sm'):''}</div>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" style="--i:${i}"><span class="n">${i+1}</span><span class="grow">${o.h}</span></button>`).join('')}</div><div style="height:140px"></div></div>
  <div class="fb"><div class="in"><button class="btn wide" id="chk" disabled>확인</button></div></div>`;
  if(furiOff)$('.qprompt').querySelectorAll('rt').forEach(r=>r.style.visibility='hidden');
  if(q.listen)setTimeout(()=>speak(q.listen),200);
  let sel=-1;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));$('#chk').disabled=false;const o=q.opts[sel];if(o.say)speak(o.say)});
  $('#chk').onclick=()=>check(sel);
  Q.keyh=e=>{if(!Q||Q.st!=='q')return;const n=+e.key;if(n>=1&&n<=q.opts.length){document.querySelectorAll('.opt')[n-1].click()}if(e.key==='Enter'&&sel>=0)check(sel)};
}
/* 키보드: 숫자 1~4 보기 선택 · Enter 확인
   Space / → : 다음 단어, 계속 · 플래시카드는 Space 뒤집기, → 알아요, ← 몰라요 */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat||e.target.closest?.('input,select,textarea')||$('#sheet'))return;
  const sp=e.key===' ',next=sp||e.key==='ArrowRight';
  if(Q){const st=Q.st;               // 이번 키로 상태가 바뀌어도(확인→피드백) 같은 키로 '계속'까지 넘어가지 않게
    if(st==='q'&&Q.keyh)Q.keyh(e);
    if(sp)e.preventDefault();                       // 스크롤·포커스된 버튼 눌림 방지
    if(st==='fb'&&(next||e.key==='Enter')){e.preventDefault();$('#cont')?.click()}
    else if(st==='intro'&&(next||e.key==='Enter')){e.preventDefault();$('#quiz .fb .btn')?.click()}
    else if(st==='done'&&(next||e.key==='Enter')){e.preventDefault();closeQuiz()}
    return}
  if($('#fl')){const k={' ':'#flc',ArrowRight:'#fly',ArrowLeft:'#fln'}[e.key];if(k&&$(k)){e.preventDefault();$(k).click()}}
});
function check(sel){const q=Q.cur;const ok=!!q.opts[sel].ok;Q.st='fb';sfx(ok?'ok':'ng');
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(q.opts[i].ok)b.classList.add('ok');else if(i===sel)b.classList.add('ng')});
  $('.qprompt').querySelectorAll('rt').forEach(r=>r.style.visibility='');
  Q.log.push({q,ok});
  if(ok){Q.correct++;Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo);const gain=10+Math.min(10,Math.floor(Q.combo/3)*2);Q.xp+=gain;Q.done++}
  else{Q.wrong++;Q.combo=0;if(!Q.timed){Q.hearts--;const rk=q.id&&q.id[0]!=='x'?q.id:q;if(!Q.retry.has(rk)){Q.retry.add(rk);Q.queue.push(rk);Q.total++}}Q.done++}
  setBar();
  if(!ok&&!Q.timed){const h=$('.hearts');if(h)h.innerHTML=heartsH(Q.hearts)}
  const cb=$('.combo');if(cb){cb.className='combo '+(Q.combo>=3?'hot':'');cb.textContent=Q.combo>=3?`🔥 ${Q.combo} 콤보!`:''}
  if(ok){xpFloat(`+${10+Math.min(10,Math.floor(Q.combo/3)*2)} XP`,document.querySelectorAll('.opt')[sel]);if(Q.combo>=3&&Q.combo%3===0){const c=Q.combo;setTimeout(()=>sfx('combo',c),200)}}
  if(q.id&&q.id[0]!=='x')srsGrade(q.id,ok);
  // 효과음과 겹치지 않게 조금 뒤에 읽는다
  if(q.sayAfter)speak(q.sayAfter,'',S.sfx?420:0);
  const fb=$('.fb');fb.className='fb '+(ok?'ok':'ng');
  fb.innerHTML=`<div class="in"><div class="t">${ok?pick(['정답이에요! 🎉','훌륭해요! ✨','완벽해요! 👏','맞아요! 💯']):'아쉬워요 😢'}</div><div class="d">${ok?'':'정답: '}${q.ans}</div><button class="btn wide ${ok?'':'red'}" id="cont">계속<span class="kh">Space</span></button></div>`;
  $('#cont').onclick=nextQ;save()}
function finishQuiz(timeUp){if(!Q)return;Q.st='done';if(Q.timer)clearInterval(Q.timer);$('.fb')?.remove();
  const failed=!Q.timed&&Q.hearts<=0;const acc=Math.round(Q.correct/Math.max(1,Q.correct+Q.wrong)*100);
  let bonus=0;if(!failed){bonus=Q.mode==='exam'?0:20;if(Q.wrong===0&&Q.correct>=5){bonus+=15;S.perfect++}}
  const total=Q.xp+bonus;const sec=Math.round((Date.now()-Q.start)/1000);
  const before=level(S.xp);addXP(total);const after=level(S.xp);
  if(!failed&&Q.onDone)Q.onDone({acc,correct:Q.correct,wrong:Q.wrong,log:Q.log,sec});
  if(!failed)S.lessons++;save();checkBadges();
  const goalHit=dayXP()>=S.goal&&dayXP()-total<S.goal;
  $('#quiz').innerHTML=`<div class="in"><div class="result pop"><div class="e">${failed?'💔':acc>=90?'🏆':acc>=70?'🎉':'💪'}</div>
  <h1>${failed?'하트를 다 썼어요':timeUp?'시간 종료!':Q.mode==='exam'?'모의고사 완료!':'레슨 완료!'}</h1>
  <p class="mute">${failed?'틀린 문제는 복습 목록에 들어갔어요. 다시 도전해 봐요!':acc===100?'한 문제도 안 틀렸어요! 퍼펙트 보너스 +15 XP':'잘했어요. 틀린 단어는 곧 다시 나와요.'}</p>
  <div class="stats"><div id="rs1">${total}<small>획득 XP</small></div><div id="rs2">${acc}%<small>정답률</small></div><div id="rs3">${Q.maxCombo}<small>최대 콤보</small></div></div>
  ${after>before?`<div class="card lvup" style="border-color:var(--y)"><b>🏅 레벨 업! Lv.${after}</b></div>`:''}
  ${goalHit?`<div class="card" style="border-color:var(--g)"><b>🎯 오늘의 목표 달성!</b></div>`:''}
  ${Q.mode==='exam'?examReview(Q.log):''}
  <button class="btn wide" onclick="closeQuiz()">계속<span class="kh">Space</span></button></div></div>`;
  countUp($('#rs1'),total);countUp($('#rs2'),acc,'%');countUp($('#rs3'),Q.maxCombo);
  sfx(failed?'fail':'win');
  if(!failed&&after>before)setTimeout(()=>sfx('level'),1000);else if(!failed&&goalHit)setTimeout(()=>sfx('goal'),1000);
  if(!failed)confetti();
}

function startVocabLesson(){const nw=newWords(S.perDay);if(!nw.length){toast('모든 단어를 배웠어요!');return}
  const due=shuffle(dueIds().filter(id=>id[0]==='v')).slice(0,5);
  const items=[];nw.forEach(v=>{items.push(qMeaning(v))});shuffle(nw).forEach(v=>items.push(pick([qReading,qReverse,qListen,qWriting])(v)));
  const all=[...items,...due];
  runQuiz({title:'새 단어',intro:nw,items:all,hearts:3,onDone:()=>{nw.forEach(v=>{if(!S.srs['v'+v.i])srsGrade('v'+v.i,true)})}})}
function startGrammarLesson(g){const items=[0,1,2].map(i=>qGrammar(g,i)).filter(Boolean);
  const prev=shuffle(Object.keys(S.gdone)).slice(0,2).map(id=>qGrammar(G[+id])).filter(Boolean);
  runQuiz({title:g.t,grammarIntro:g,items:[...items,...prev],hearts:3,onDone:({acc})=>{S.gdone[g.id]=today();save()}})}
function startReview(){const due=shuffle(dueIds()).slice(0,15);runQuiz({title:'복습',items:due,hearts:4})}
function startKanjiLesson(){const unk=KJ.filter(k=>!S.kknown[k.c]);const set=sample(unk.length>=8?unk.slice(0,40):KJ,8);
  runQuiz({title:'한자',items:set.map(qKanji),hearts:3,onDone:({log})=>{log.forEach(l=>{if(l.ok&&l.q.id[0]==='k')S.kknown[l.q.id.slice(1)]=1});save()}})}

  <p class="mute" style="font-size:12px;margin:8px 0 0">🔊 파랑 = 여성 음성 · 보라 = 남성 음성</p></div>`}
let gq='';
function grammarView(){$('#app').innerHTML=`<h1>📘 N3 문법 <span class="mute" style="font-size:15px">${G.length}개</span></h1>

function openGrammar(g){const ov=document.createElement('div');ov.className='ov';ov.id='gd';

  <div class="row"><button class="btn ghost grow" ${g.id?'':'disabled'} id="gp">← 이전</button><button class="btn grow" id="gpr">연습 문제</button><button class="btn ghost grow" ${g.id<G.length-1?'':'disabled'} id="gn">다음 →</button></div></div>`;
  $('#gd')?.remove();document.body.appendChild(ov);document.body.style.overflow='hidden';ov.scrollTop=0;

function vocabView(){const POS=['전체','명사','동사','い형용사','な형용사','부사','접속사','외래어','인사·감탄'];

  <input type="search" id="vs" placeholder="일본어·읽기·한국어 뜻으로 검색" value="${esc(vf.q)}"><div style="height:10px"></div>
  <div class="chips" id="vp">${POS.map(p=>`<button class="${vf.pos===p?'on':''}" data-p="${p}">${p}</button>`).join('')}</div>
  <div class="chips" id="vst">${['전체','학습함','아직','★ 즐겨찾기'].map(p=>`<button class="${vf.st===p?'on':''}" data-p="${p}">${p}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:12px"><span class="mute grow" id="vc"></span><button class="btn blue" id="vflash" style="padding:9px 14px">🃏 플래시카드</button></div>
  <div class="list" id="vl"></div><div style="text-align:center;margin-top:12px"><button class="btn ghost" id="vmore" style="display:none">더 보기</button></div>`;
  const filt=()=>{const q=vf.q.trim().toLowerCase();return VORD.filter(v=>(vf.pos==='전체'||v.p===vf.pos)&&(!q||v.w.includes(q)||v.r.includes(q)||v.k.toLowerCase().includes(q))&&(vf.st==='전체'||(vf.st==='학습함'?S.srs['v'+v.i]:vf.st==='아직'?!S.srs['v'+v.i]:S.star[v.i]>0)))};
  const draw=()=>{const L=filt();$('#vc').textContent=`${L.length}개`;
    $('#vl').innerHTML=L.length?L.slice(0,vf.lim).map(v=>`<div class="vitem"><button class="star ${S.star[v.i]>0?'on':''}" data-s="${v.i}">★</button><div class="grow"><div class="w jp">${ruby(v.f)}</div><div class="k">${esc(v.k)} <span class="chip" style="font-size:10px;padding:1px 7px">${v.p}</span> ${S.srs['v'+v.i]?'<span style="color:var(--g);font-size:12px;font-weight:800">✓</span>':''}</div></div>${spk(v.f)}</div>`).join(''):'<div class="empty">조건에 맞는 단어가 없어요</div>';
    $('#vmore').style.display=L.length>vf.lim?'':'none';
    document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=b.dataset.s;S.star[i]=S.star[i]>0?-Date.now():Date.now();b.classList.toggle('on');save()})};
  $('#vs').oninput=e=>{vf.q=e.target.value;vf.lim=80;draw()};
  document.querySelectorAll('#vp button').forEach(b=>b.onclick=()=>{vf.pos=b.dataset.p;vf.lim=80;vocabView()});
  document.querySelectorAll('#vst button').forEach(b=>b.onclick=()=>{vf.st=b.dataset.p;vf.lim=80;vocabView()});
  $('#vmore').onclick=()=>{vf.lim+=120;draw()};
  $('#vflash').onclick=()=>{const L=filt();if(!L.length)return;flash(shuffle(L).slice(0,30))};draw()}
function flash(list){let i=0,flip=false;const ov=document.createElement('div');ov.className='ov';ov.id='fl';document.body.appendChild(ov);document.body.style.overflow='hidden';
  const draw=(fx)=>{const v=list[i];ov.innerHTML=`<div class="in"><div class="qhead"><button class="x" id="flx">✕</button><div class="bar"><i style="width:${(i)/list.length*100}%"></i></div><span class="mute">${i+1}/${list.length}</span></div>
    <button class="card" id="flc" style="width:100%;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
    <div class="jp" style="font-size:48px;line-height:2">${flip?ruby(v.f):esc(v.w)}</div>${flip?`<div style="font-size:22px;font-weight:800">${esc(v.k)}</div><span class="chip">${v.p}</span>`:'<div class="mute">탭해서 뜻 보기</div>'}</button>
    <div class="row" style="justify-content:center;margin:6px 0 16px">${spk(v.f)}${spk(v.f,'f','m')}</div>
    <div class="row"><button class="btn red grow" id="fln">😵 몰라요<span class="kh">←</span></button><button class="btn grow" id="fly">😎 알아요<span class="kh">→</span></button></div><p class="mute kh" style="text-align:center;margin-top:12px;font-size:12px">Space 뒤집기 · → 알아요 · ← 몰라요</p></div>`;
    if(fx)$('#flc').classList.add(fx);
    $('#flx').onclick=()=>{ov.remove();document.body.style.overflow='';render()};
    $('#flc').onclick=()=>{flip=!flip;draw('flip');sfx('flip');if(flip)speak(v.f)};
    $('#fly').onclick=()=>{sfx('know');srsGrade('v'+v.i,true);addXP(2);nx()};$('#fln').onclick=()=>{sfx('dunno');srsGrade('v'+v.i,false);list.push(v);nx()}};
  const nx=()=>{i++;flip=false;save();if(i>=list.length){ov.innerHTML=`<div class="in"><div class="result pop"><div class="e">🃏</div><h1>플래시카드 완료!</h1><button class="btn wide" onclick="$('#fl').remove();document.body.style.overflow='';render()">닫기</button></div></div>`;confetti();sfx('win');checkBadges()}else draw('next')};draw()}

/* ---------------- 계정 · 기기 동기화 (Firebase) ----------------
   아이디/비밀번호 → Firebase Auth(이메일 로그인, 아이디@maeil-n3.invalid 로 바꿔서 씀)
   학습 기록 S 전체 → Firestore users/{uid} 문서 하나 ({data: JSON 문자열, ut, v})
   두 기기에서 따로 공부한 기록은 mergeS()로 합친다. 설정은 나중에 바꾼 쪽이 이긴다. */
const FBCFG=/*FIREBASE*/null;
const FBSDK='https://www.gstatic.com/firebasejs/13.2.0/';
const AUTHFLAG='maeil-n3-auth';               // 로그인한 적 있는 기기만 SDK를 불러오기 위한 표시
const LOCAL_ONLY=['voice'];                    // 기기마다 다른 값(음성 이름)은 동기화하지 않는다
const CS={user:null,id:'',status:'off',last:0,err:''};  // status: off|syncing|ok|offline|error
let FB=null,fbP=null,unsub=null,pushT=null;
const ID_RE=/^[a-z0-9_]{3,20}$/;
const idMail=id=>id+'@maeil-n3.invalid';
function fbInit(){if(!FBCFG)return Promise.reject(new Error('nocfg'));if(fbP)return fbP;
  fbP=Promise.all(['app','auth','firestore'].map(m=>import(FBSDK+'firebase-'+m+'.js'))).then(([app,A,F])=>{
    const a=app.initializeApp(FBCFG);FB={auth:A.getAuth(a),db:F.getFirestore(a),A,F};
    A.onAuthStateChanged(FB.auth,onUser);return FB}).catch(e=>{fbP=null;throw e});
  return fbP}
// 키 순서와 상관없이 같은 내용이면 같은 문자열
function stable(o){if(Array.isArray(o))return '['+o.map(stable).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';return JSON.stringify(o)}
const shared=o=>{const r={...o};LOCAL_ONLY.forEach(k=>delete r[k]);return r};
// 두 기록 합치기. 순서를 바꿔 넣어도 결과가 같아야 기기끼리 핑퐁하지 않는다.
function mergeS(a,b){const L=a;
  const ea=a._ep||0,eb=b._ep||0;
  if(ea!==eb){const w=ea>eb?a:b;return {...DEF,...w,voice:L.voice}}        // 한쪽에서 초기화했으면 그쪽을 따른다
  const ua=a._ut||0,ub=b._ut||0;const an=ua!==ub?ua>ub:stable(shared(a))>=stable(shared(b));
  const n=an?a:b,o=an?b:a;                                                 // n: 더 최근에 바뀐 쪽
  const r={...DEF,...o,...n};
  const maxMap=(x={},y={})=>{const m={...x};for(const k in y)m[k]=Math.max(m[k]||0,y[k]||0);return m};
  r.days=maxMap(a.days,b.days);r.kana=maxMap(a.kana,b.kana);
  const better=(p,q)=>{const pn=p.n||0,qn=q.n||0;if(pn!==qn)return pn>qn?p:q;if(p.d!==q.d)return p.d>q.d?p:q;return stable(p)>=stable(q)?p:q};
  r.srs={...(a.srs||{})};for(const k in (b.srs||{}))r.srs[k]=r.srs[k]?better(r.srs[k],b.srs[k]):b.srs[k];
  r.gdone={...o.gdone,...n.gdone};r.kknown={...o.kknown,...n.kknown};r.badges={...o.badges,...n.badges};
  // 즐겨찾기 값은 바꾼 시각(+켬 / -끔) → 단어마다 더 나중에 바꾼 쪽
  r.star={...(a.star||{})};for(const k in (b.star||{})){const x=r.star[k],y=b.star[k];r.star[k]=x==null||Math.abs(y)>Math.abs(x)||(Math.abs(y)===Math.abs(x)&&y>x)?y:x}
  const ex=new Map();[...(a.exams||[]),...(b.exams||[])].forEach(e=>ex.set(stable(e),e));
  r.exams=[...ex.entries()].sort((x,y)=>(x[1].d||'')<(y[1].d||'')?-1:(x[1].d||'')>(y[1].d||'')?1:x[0]<y[0]?-1:x[0]>y[0]?1:0).map(x=>x[1]);
  r.xp=Math.max(a.xp||0,b.xp||0,Object.values(r.days).reduce((s,x)=>s+x,0));
  for(const k of ['lessons','perfect','best'])r[k]=Math.max(a[k]||0,b[k]||0);
  if((a.last||'')!==(b.last||'')){const w=(a.last||'')>(b.last||'')?a:b;r.last=w.last;r.streak=w.streak;r.freezes=w.freezes}
  else{r.streak=Math.max(a.streak||0,b.streak||0);r.freezes=Math.min(a.freezes||0,b.freezes||0)}
  r.best=Math.max(r.best,r.streak);r._ut=Math.max(ua,ub);r.voice=L.voice;
  return r}
function syncUI(){const i=$('#iAcc');if(i){i.className=CS.status==='syncing'?'spin':'';i.textContent=!CS.user?'👤':CS.status==='syncing'?'🔄':CS.status==='ok'?'☁️':'⚠️'}
  const st=$('#acSt');if(st)st.innerHTML=syncLine()}
function syncLine(){const t=CS.last?new Date(CS.last).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
  return `<span class="syncdot ${CS.status}"></span>${CS.status==='syncing'?'동기화 중…':CS.status==='ok'?`동기화됨${t?' · '+t:''}`:CS.status==='offline'?'오프라인 — 연결되면 자동으로 올라가요':CS.status==='error'?`동기화 오류 (${esc(CS.err)}) — 잠시 후 다시 시도해요`:''}`}
// 다른 기기에서 바뀐 기록이 들어왔을 때 화면 갱신 (문제 푸는 중이면 화면은 그대로 두고 상단 숫자만)
function refreshUI(){if(Q||$('#fl')||$('#gd')||$('#sheet')){hdr();NEEDR=true}else render()}
function applyRemote(d,first){const uid=CS.user.uid;let R=null;if(d&&typeof d.data==='string'){try{R=JSON.parse(d.data)}catch(e){}}
  let M;
  if(!R)M={...S};
  else M=mergeS(S,R);
  // 이 기기의 기록이 다른 계정에 연결돼 있던 거면(이미 그 계정에 올라가 있음) 섞지 않고 이 계정 기록으로 바꾼다
  if(first&&S._uid&&S._uid!==uid)M={...DEF,...(R||{}),voice:S.voice};
  M._uid=uid;
  const changed=stable(M)!==stable(S);S=M;saveLocal();if(changed)refreshUI();
  if(!R||stable(shared(M))!==stable(shared(R)))push();else{CS.status='ok';CS.last=Date.now();syncUI()}}
async function onUser(u){if(unsub){unsub();unsub=null}clearTimeout(pushT);
  CS.user=u;CS.id=u?u.email.split('@')[0]:'';
  if($('#sheet .acc')||$('#acSt'))acctSheet();   // 열려 있는 계정 창을 새 상태로
  if(!u){CS.status='off';syncUI();refreshUI();return}
  try{localStorage.setItem(AUTHFLAG,'1')}catch(e){}
  CS.status='syncing';syncUI();refreshUI();
  const {F}=FB,ref=F.doc(FB.db,'users',u.uid);let first=true;
  unsub=F.onSnapshot(ref,s=>{if(s.metadata.hasPendingWrites)return;if(!CS.user||CS.user.uid!==u.uid)return;applyRemote(s.exists()?s.data():null,first);first=false},
    e=>{CS.status=navigator.onLine?'error':'offline';CS.err=e.code||'';syncUI()})}
function queuePush(){if(!CS.user)return;CS.status='syncing';syncUI();clearTimeout(pushT);pushT=setTimeout(push,1500)}
async function push(){clearTimeout(pushT);pushT=null;if(!CS.user||!FB)return;const {F}=FB,u=CS.user;CS.status='syncing';syncUI();
  try{await F.setDoc(F.doc(FB.db,'users',u.uid),{data:JSON.stringify(shared(S)),ut:S._ut||Date.now(),v:1});if(CS.user!==u)return;CS.status='ok';CS.last=Date.now()}
  catch(e){CS.status=navigator.onLine?'error':'offline';CS.err=e.code||e.message||''}syncUI()}
// 탭을 닫거나 다른 앱으로 갈 때 대기 중인 저장을 바로 올린다

async function acctSubmit(mode){const m=$('#acMsg'),id=$('#acId').value.trim().toLowerCase(),pw=$('#acPw').value;

    <p class="mute" style="font-size:14px">컴퓨터·핸드폰 어디서든 같은 아이디로 로그인하면 XP, 스트릭, 단어 복습 기록이 그대로 이어져요. 공부할 때마다 자동으로 저장돼요.</p>
    <div class="row"><button class="btn ghost grow" onclick="push()">🔄 지금 동기화</button><button class="btn red grow" onclick="acctLogout()">로그아웃</button></div>
    <div style="height:10px"></div><button class="btn wide" onclick="closeSheet()">닫기</button>`);return}
  const isNew=mode==='new';
  sheet(`<h2 style="margin-top:0">${isNew?'🆕 새 계정 만들기':'☁️ 로그인'}</h2>
    <p class="mute" style="font-size:14px;margin-top:-4px">아이디와 비밀번호만 있으면 컴퓨터·핸드폰에서 같은 기록으로 이어서 공부할 수 있어요.${isNew?' 지금 이 기기의 기록이 새 계정에 그대로 올라가요.':' 이 기기의 기록은 계정 기록과 합쳐져요.'}</p>
    <form class="acc" onsubmit="event.preventDefault();acctSubmit('${isNew?'new':'login'}')">
    <input type="text" id="acId" placeholder="아이디 (영문 소문자·숫자 3~20자)" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20">
    <input type="password" id="acPw" placeholder="비밀번호 (6자 이상)" autocomplete="${isNew?'new-password':'current-password'}">
    ${isNew?'<input type="password" id="acPw2" placeholder="비밀번호 확인" autocomplete="new-password">':''}
    <div class="acmsg" id="acMsg"></div>
    <button class="btn wide ${isNew?'':'blue'}" type="submit">${isNew?'계정 만들기':'로그인'}</button>
    <div style="text-align:center;margin-top:14px;font-size:14px">${isNew?'이미 계정이 있나요? <button type="button" class="linkbtn" onclick="acctSheet(\'login\')">로그인</button>':'처음이세요? <button type="button" class="linkbtn" onclick="acctSheet(\'new\')">새 계정 만들기</button>'}</div>
    </form>
    <p class="mute" style="font-size:12px;margin-top:16px">⚠️ 이메일을 받지 않기 때문에 비밀번호를 잊으면 찾을 수 없어요. 꼭 기억해 두세요.</p>`);
  setTimeout(()=>$('#acId')?.focus(),300)}
$('#sAcc').onclick=()=>acctSheet();
// 로그인한 적 있는 기기면 시작할 때 자동으로 연결
try{if(FBCFG&&localStorage.getItem(AUTHFLAG))fbInit().catch(()=>{CS.status='offline';syncUI()})}catch(e){}

/* boot */
(function(){const h=location.hash.slice(1);if(VIEWS[h])VIEW=h;render();checkBadges()})();
</script>
</body>
